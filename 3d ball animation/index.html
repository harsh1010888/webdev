<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Ball Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            perspective: 1000px;
        }

        .container {
            width: 200px;
            height: 200px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ball {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
            border-radius: 50%;
            transition: transform 0.3s ease-out;
            box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.6),
                        inset 10px 10px 20px rgba(255, 255, 255, 0.2),
                        0 10px 30px rgba(255, 0, 0, 0.5);
        }

        /* Move ball in different directions when cursor hits */
        .container:hover .ball {
            transform: translateX(30px) translateY(-30px) rotateX(20deg) rotateY(20deg);
        }

        /* Different directions based on hover areas */
        .container:hover:before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(10px);
            animation: glow 0.5s infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            }
            to {
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ball"></div>
    </div>
</body>
</html>
